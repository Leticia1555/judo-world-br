<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="judo.png">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="conta.css">
    <title>Conta/Perfil</title>
</head>
<body id="body">
     <div class="mobile-topbar">
        <a class="brand-mobile" href="index.html">
            <img src="judo.png" alt="Ícone do Judô">
            <span>Judô World BR</span>
        </a>

        <div class="mobile-search">
            <span aria-hidden="true">🔍</span>
            <input type="text" placeholder="Pesquisar">
        </div>

        <div class="mobile-actions">
            <a class="mobile-icon" href="conta.html" aria-label="Conta">👤</a>
            <div class="menu-mobile" onclick="abrirMenu()" role="button" tabindex="0" aria-label="Abrir menu" aria-expanded="false" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); abrirMenu();}">
                ☰
            </div>
        </div>
    </div>

    <div class="links-nav" id="linksNav">
        <nav>
            <a href="index.html"><img class="judo" src="judo.png" alt=""></a>
           <a href="index.html"><img src="imagens/botao-de-inicio.png" alt="" width="13%"> Home</a>
           <a href="loja.html"><img  src="imagens/loja.png" alt="" width="12%"> Loja</a>
           <a href="aulas.html"><img  src="imagens/computador-desktop.png" alt="" width="12%"> Aulas</a>
           <img src="imagens/lupa.png" alt="" width="6%"><input class="barra" type="text" placeholder="Search.." >
           <a href="conta.html"><img  src="imagens/do-utilizador.png" alt="" width="12%"> Contas</a>
           <img src="imagens/energia-solar.png" id="light" width="7%">
           <img src="imagens/lua-crescente.png" id="dark" width="7%">
        </nav>

    </div>


    <div class="pagina-conta">
       <br><br>
        <h1>Conta / Perfil</h1>
        <div class="formularios-container">
            <div id="login-form" class="cadastro">
                <h1>login</h1>
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" name="Email" id="loginemail" placeholder="email"><br>
                </div>
                <div class="input-box">
                    <label>Senha</label>
                    <div class="password-field-with-icon">
                        <input type="password" name="Senha" id="loginSenha" placeholder="senha">
                        <img src="imagens/olho.png" class="password-toggle-icon" onclick="togglePasswordVisibility('loginSenha', this)" alt="Mostrar senha" title="Mostrar senha">
                    </div><br>
                </div>

                <button onclick="login()">logar</button>
                <a href="logar.html">Voltar para a página de conta</a>
            </div>
        </div>
        <p id="mensagem"></p>

        <div id="perfil" style="display:none">
            <h2>Perfil</h2>
            <p><strong>Nome:</strong> <span id="perfil-nome"></span></p>
            <p><strong>Email:</strong> <span id="perfil-email"></span></p>
            <p><strong>Faixa:</strong> <span id="perfil-faixa"></span></p>
            <p><strong>Tipo:</strong> <span id="perfil-role"></span></p>
            <button onclick="logout()">Sair</button>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
