<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="judo.png">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="conta.css">
    <link rel="stylesheet" href="loja.css">
    <title>Carrinho | Judô World BR</title>
    <style>
        body {
            background: #f5f5f5;
        }

        .carrinho-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px 40px;
        }

        .carrinho-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .carrinho-topo h2 {
            font-size: 30px;
        }

        .voltar-btn {
            background: #111;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .carrinho-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .itens-carrinho {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-carrinho {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 15px;
        }

        .item-carrinho img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .item-carrinho-info {
            flex: 1;
        }

        .item-carrinho-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .item-carrinho-info p {
            color: #2a9d5a;
            font-weight: bold;
        }

        .remover-item {
            border: none;
            background: #d84f3a;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .resumo-carrinho {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .resumo-carrinho h3 {
            margin-bottom: 15px;
        }

        .resumo-carrinho .total {
            font-size: 24px;
            font-weight: bold;
            color: #111;
            margin-top: 10px;
        }

        .carrinho-vazio {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: #666;
        }

        @media (max-width: 768px) {
            .carrinho-content {
                grid-template-columns: 1fr;
            }

            .carrinho-topo {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-carrinho {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <main class="carrinho-container">
        <div class="carrinho-topo">
            <h2>Seu carrinho</h2>
            <button class="voltar-btn" onclick="window.location.href='loja.html'">Continuar comprando</button>
        </div>

        <div class="carrinho-content">
            <section id="lista-carrinho" class="itens-carrinho"></section>

            <aside class="resumo-carrinho">
                <h3>Resumo</h3>
                <div id="resumo-carrinho"></div>
            </aside>
        </div>
    </main>

    <script src="carrinho.js"></script>
</body>
</html>
