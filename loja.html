<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#ffffff">

    <link
        rel="icon"
        href="judo.png">

    <link
        rel="stylesheet"
        href="css/loja.css">

    <title>Loja - Judô World</title>

</head>

<body>

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

        <a href="index.html" class="logo">
                <div class="logo-mark">柔</div>

                <div class="logo-text">
                    <strong>JUDÔ WORLD</strong>
                    <span>BRASIL</span>
                </div>
            </a>



    <div class="header-actions">

        <!-- PESQUISA -->

        <button
            class="header-search"
            onclick="focarPesquisa()"
            aria-label="Pesquisar">

            🔍

        </button>


        <!-- CARRINHO -->

        <a
            href="carrinho.html"
            class="cart-button">

            🛒

            <span
                id="cartCount"
                class="cart-count">

                0

            </span>

        </a>


        <!-- BOTÃO DO VENDEDOR -->

        <button
            id="sellerButton"
            class="header-button"
            style="display:none;">

            🏪 Minha Loja

        </button>


        <!-- TEMA -->

        <button
            id="themeButton"
            class="theme-button"
            type="button">
            🌙
        </button>

        <a href="index.html" class="back-button">
            ← Voltar
        </a>

    </div>

</header>



<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main>


    <!-- =================================================
         TÍTULO
    ================================================== -->

    <section class="page-title">

        <small>JUDÔ WORLD BR</small>

        <h1>Loja</h1>

        <p>
            Produtos e equipamentos para judocas.
        </p>

    </section>



    <!-- =================================================
         PAINEL DO VENDEDOR
    ================================================== -->

    <section
        id="sellerPanel"
        class="seller-panel">


        <div class="seller-title">

            <div>

                <span class="seller-label">
                    ÁREA DO VENDEDOR
                </span>

                <h2>
                    🏪 Minha Loja
                </h2>

            </div>

            <span class="seller-badge">
                VENDEDOR
            </span>

        </div>


        <!-- LOJA -->

        <form id="storeForm">

            <div class="seller-grid">

                <div class="field">

                    <label>
                        Nome da loja
                    </label>

                    <input
                        id="storeName"
                        type="text"
                        placeholder="Ex: Samurai Store"
                        required>

                </div>


                <div class="field">

                    <label>
                        Categoria
                    </label>

                    <select id="storeCategory">

                        <option>
                            Kimonos
                        </option>

                        <option>
                            Faixas
                        </option>

                        <option>
                            Equipamentos
                        </option>

                        <option>
                            Acessórios
                        </option>

                        <option>
                            Roupas
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Descrição da loja
                    </label>

                    <textarea
                        id="storeDescription"
                        placeholder="Fale sobre sua loja..."></textarea>

                </div>


                <button
                    class="red-button"
                    type="submit">

                    Salvar loja

                </button>

            </div>

        </form>


        <div class="seller-divider"></div>


        <!-- PRODUTO -->

        <div class="seller-title product-title">

            <h2>
                Adicionar produto
            </h2>

        </div>


        <form id="productForm">

            <div class="seller-grid">


                <div class="field">

                    <label>
                        Nome do produto
                    </label>

                    <input
                        id="productName"
                        type="text"
                        placeholder="Ex: Kimono Judô"
                        required>

                </div>


                <div class="field">

                    <label>
                        Categoria
                    </label>

                    <select id="productCategory">

                        <option>
                            Kimonos
                        </option>

                        <option>
                            Faixas
                        </option>

                        <option>
                            Equipamentos
                        </option>

                        <option>
                            Acessórios
                        </option>

                        <option>
                            Roupas
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Preço
                    </label>

                    <input
                        id="productPrice"
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="199.90"
                        required>

                </div>


                <div class="field">

                    <label>
                        Ícone
                    </label>

                    <input
                        id="productIcon"
                        type="text"
                        value="🥋"
                        placeholder="🥋">

                </div>


                <div class="field full">

                    <label>
                        Descrição
                    </label>

                    <input
                        id="productDescription"
                        type="text"
                        placeholder="Descrição do produto">

                </div>


                <button
                    class="red-button"
                    type="submit">

                    + Adicionar produto

                </button>

            </div>

        </form>

    </section>



    <!-- =================================================
         INFORMAÇÕES DA LOJA
    ================================================== -->

    <section class="store-info">

        <div class="store-logo">
            🥋
        </div>


        <div>

            <h2 id="displayStoreName">
                Judô World Store
            </h2>

            <p id="displayStoreDescription">
                Produtos para praticantes de judô.
            </p>

        </div>

    </section>



    <!-- =================================================
         PESQUISA E FILTRO
    ================================================== -->

    <section class="shop-tools">

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Pesquisar produto...">

        </div>


        <select id="categoryFilter">

            <option value="todos">
                Todas as categorias
            </option>

            <option value="Kimonos">
                Kimonos
            </option>

            <option value="Faixas">
                Faixas
            </option>

            <option value="Equipamentos">
                Equipamentos
            </option>

            <option value="Acessórios">
                Acessórios
            </option>

            <option value="Roupas">
                Roupas
            </option>

        </select>

    </section>



    <!-- =================================================
         PRODUTOS
    ================================================== -->

    <section
        id="products"
        class="products">

    </section>


    <!-- =================================================
         NENHUM PRODUTO
    ================================================== -->

    <section
        id="empty"
        class="empty">

        <div>
            🔎
        </div>

        <h2>
            Nenhum produto encontrado
        </h2>

        <p>
            Tente mudar sua pesquisa ou filtro.
        </p>

    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/loja.js"></script>

</body>

</html>
