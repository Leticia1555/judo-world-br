<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#ffffff">

    <link
        rel="icon"
        href="judo.png">

    <link
        rel="stylesheet"
        href="css/aulas.css">

    <title>Aulas - Judô World</title>

</head>

<body>

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

    <a
        href="index.html"
        class="logo">

        JUDÔ <span>WORLD</span>

    </a>


    <div class="header-actions">

        <!-- PESQUISA -->

        <button
            class="search-button"
            onclick="focarPesquisa()"
            aria-label="Pesquisar">

            🔍

        </button>


        <!-- TEMA -->

    <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="Alternar modo">
        🌙
    </button>

    <a href="index.html" class="back-button">
        ← Voltar
    </a>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main>


    <!-- =================================================
         TÍTULO
    ================================================== -->

    <section class="page-title">

        <small>
            JUDÔ WORLD BR
        </small>

        <h1>
            Aulas de Judô
        </h1>

        <p>
            Aprenda técnicas e evolua no judô.
        </p>

    </section>


    <!-- =================================================
         DESTAQUE
    ================================================== -->

    <section class="featured">

        <div class="featured-icon">
            🥋
        </div>


        <div class="featured-content">

            <span>
                AULA EM DESTAQUE
            </span>

            <h2>
                Fundamentos do Judô
            </h2>

            <p>
                Aprenda os principais fundamentos,
                movimentos e posições do judô.
            </p>


            <div class="featured-info">

                <span>
                    🟢 Iniciante
                </span>

                <span>
                    ⏱️ 25 min
                </span>

            </div>


            <button
                class="watch-button"
                onclick="abrirAula(1)">

                ▶ Assistir aula

            </button>

        </div>

    </section>


    <!-- =================================================
         PESQUISA E FILTRO
    ================================================== -->

    <section class="lesson-tools">

        <div class="search-box">

            <span>
                🔍
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="Pesquisar aula...">

        </div>


        <select id="levelFilter">

            <option value="todos">
                Todos os níveis
            </option>

            <option value="Iniciante">
                Iniciante
            </option>

            <option value="Intermediário">
                Intermediário
            </option>

            <option value="Avançado">
                Avançado
            </option>

        </select>

    </section>


    <!-- =================================================
         LISTA DE AULAS
    ================================================== -->

    <section
        id="lessons"
        class="lessons">

    </section>


    <!-- =================================================
         NENHUMA AULA
    ================================================== -->

    <section
        id="empty"
        class="empty">

        <div>
            🔎
        </div>

        <h2>
            Nenhuma aula encontrada
        </h2>

        <p>
            Tente mudar sua pesquisa ou filtro.
        </p>

    </section>

</main>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/aulas.js"></script>

</body>

</html>
